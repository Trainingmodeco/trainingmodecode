# Every PR into `app` (which auto-deploys to apptrainingmode.com) runs the same
# gates that are run by hand before each merge, so a broken change shows a red
# X on the PR instead of reaching users.
name: checks

on:
  pull_request:
    branches: [app]
  push:
    branches: [app]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run -s lint

      # The indoor-tracking suite is timing-sensitive and occasionally flakes
      # on a busy machine; one retry separates a flake from a real failure.
      - name: Indoor tracking tests
        run: npm run -s test:indoor || npm run -s test:indoor

      - name: Cardio generator tests
        run: npm run -s test:cardio

      - name: GPS fix filter tests
        run: npm run -s test:gps

      - name: Quick Mission tests
        run: npm run -s test:missions

      # GUIDED or AT YOUR PACE for today's mission: the adapter, the pace
      # tiers, the XP parity with guided, the floors and the words.
      - name: Quick Mission at-your-pace tests
        run: npm run -s test:ayp

      # XP verdicts and the Level page's words and maths (levels, tiers, recap,
      # copy rules). Both are in check:all; they were not gating PRs.
      - name: XP verdict tests
        run: npm run -s test:xp

      - name: Level page tests
        run: npm run -s test:levels

      # The athlete's level for training: effective XP (own side in full, the
      # rest at half), the EASY / NORMAL / HARD / ADVANCED tier and the
      # surprise range every workout's starting difficulty comes from.
      - name: Athlete level tests
        run: npm run -s test:athlete

      - name: Combat Conditioning audit
        run: npm run -s audit:cc

      - name: Exercise library sanity
        run: npm run -s check:exercises

      - name: Screen guides resolve
        run: npm run -s check:guides

      # Also checks every referenced image exists and matches assets.lock.json.
      - name: Web build
        run: npm run -s build:web

      # Mounts every mode of the PRODUCTION bundle in headless Chrome and fails
      # on the runtime-error screen or any uncaught error — the class of bug
      # tsc, lint and the unit tests cannot see.
      - name: Runtime smoke test (production build)
        run: npm run -s smoke:web
