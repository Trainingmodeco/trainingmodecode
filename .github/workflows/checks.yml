# Every PR into `app` (which auto-deploys to apptrainingmode.com) runs the same
# gates that are run by hand before each merge, so a broken change shows a red
# X on the PR instead of reaching users.
name: checks

on:
  pull_request:
    branches: [app]
  push:
    branches: [app]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # The full gate (build + production smoke) takes 30-45 minutes; at 20 every
    # run on `app` was cancelled before it finished, so nothing was checked.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run -s lint

      # The indoor-tracking suite is timing-sensitive and occasionally flakes
      # on a busy machine; one retry separates a flake from a real failure.
      - name: Indoor tracking tests
        run: npm run -s test:indoor || npm run -s test:indoor

      - name: Cardio generator tests
        run: npm run -s test:cardio

      - name: GPS fix filter tests
        run: npm run -s test:gps

      - name: Quick Mission tests
        run: npm run -s test:missions

      # GUIDED or AT YOUR PACE for today's mission: the adapter, the pace
      # tiers, the XP parity with guided, the floors and the words.
      - name: Quick Mission at-your-pace tests
        run: npm run -s test:ayp

      # MAX OUT: the five max-rep workouts, their swap rules, the coach's words,
      # the XP, floors and caps, the saved score and Build Workout's hand-off.
      - name: MAX OUT tests
        run: npm run -s test:maxout

      # XP verdicts and the Level page's words and maths (levels, tiers, recap,
      # copy rules). Both are in check:all; they were not gating PRs.
      - name: XP verdict tests
        run: npm run -s test:xp

      - name: Level page tests
        run: npm run -s test:levels

      # The athlete's level for training: effective XP (own side in full, the
      # rest at half), the EASY / NORMAL / HARD / ADVANCED tier and the
      # surprise range every workout's starting difficulty comes from.
      - name: Athlete level tests
        run: npm run -s test:athlete

      # What Combo Coach deals at each level: the pieces helper, the one mix
      # table, the caps (Easy 4 pieces and no difficult kick, Normal 7 and 2 a
      # round) and the swing at the top, over thousands of deals.
      - name: Combo Coach mix tests
        run: npm run -s test:combomix

      # The spoken coach's engine rules on a fake speechSynthesis: no speak()
      # inside the window after a cancel() (Android drops it), silent mode on a
      # dead engine, retry with the device voice, graceful session end.
      - name: Voice coach tests
        run: npm run -s test:voice

      # The recorded coach voice: a line cut into phrases, the clips played
      # back to back through Web Audio (order, gaps, cancel), the fall-back to
      # the speech engine, and a page with no speech engine still speaking.
      - name: Voice clips tests
        run: npm run -s test:clips

      # Every line the coach can say should have recorded clips in both voices
      # (new workouts and strikes need new clips). Report only until the
      # banks are complete; then add --strict.
      - name: Voice coverage
        run: npm run -s voice:coverage

      - name: Combat Conditioning audit
        run: npm run -s audit:cc

      - name: Exercise library sanity
        run: npm run -s check:exercises

      - name: Screen guides resolve
        run: npm run -s check:guides

      # Also checks every referenced image exists and matches assets.lock.json.
      - name: Web build
        run: npm run -s build:web

      # Fit Mode's screens name 'Chakra Petch' and 'Barlow', which the app does not
      # load yet, so they render in the system sans-serif. The layout checks were
      # measured with Inter as that font (as on the dev machines); the runner's
      # default (DejaVu Sans) is wider and failed five fit-on-screen checks that
      # pass on Inter and on phones (Roboto, San Francisco). Same font, same numbers.
      - name: Fallback font for the layout checks (Inter)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter
          sudo tee /etc/fonts/conf.d/56-prefer-inter.conf > /dev/null <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>ui-sans-serif</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f > /dev/null
          echo "system-ui -> $(fc-match system-ui)"

      # Mounts every mode of the PRODUCTION bundle in headless Chrome and fails
      # on the runtime-error screen or any uncaught error — the class of bug
      # tsc, lint and the unit tests cannot see.
      - name: Runtime smoke test (production build)
        run: npm run -s smoke:web
