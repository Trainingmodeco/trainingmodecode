<title>Exercise Loop Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a working board. Six sections: what still needs a video, the raw footage to name and queue, the finished loops to review, the loops made so far, the new exercises, and the squats to name. One editor opens in place per row; each footage card carries its own small form. On the two footage tabs every box has a size that does not depend on what loads into it. */
:root { --bg: #F5F2FB; --surface: #FFFFFF; --sunk: #ECE7F7; --ink: #1B1230; --muted: #5E5478; --line: #D9D1EA; --line-strong: #8579A6; --accent: #6D3FD1; --gold: #8A6100; --good: #1E7B46; --warn: #B4491F; --on-accent: #FFFFFF; --stage: #0A0014;
  --display: 'Chakra Petch', 'Trebuchet MS', sans-serif; --body: 'Inter', system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0B0614; --surface: #140D24; --sunk: #1B1230; --ink: #EFE8FB; --muted: #AB9FC8; --line: #2D2147; --line-strong: #7A6BA3; --accent: #C4A3FF; --gold: #F2BE45; --good: #4ADE80; --warn: #FF9A6B; --on-accent: #0B0614; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0B0614; --surface: #140D24; --sunk: #1B1230; --ink: #EFE8FB; --muted: #AB9FC8; --line: #2D2147; --line-strong: #7A6BA3; --accent: #C4A3FF; --gold: #F2BE45; --good: #4ADE80; --warn: #FF9A6B; --on-accent: #0B0614; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 20px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
header { display: flex; flex-direction: column; gap: 8px; }
main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h1 { font: 700 clamp(24px, 5vw, 32px)/1.15 var(--display); margin: 0; text-wrap: balance; }
h2.grp { font: 600 12px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 10px 0 0; }
h3.nm { font: 600 15px var(--display); letter-spacing: .03em; margin: 0; min-width: 0; overflow-wrap: anywhere; }
p { margin: 0; max-width: 68ch; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.state { font-size: 13px; padding: 8px 12px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.state .sum { font-variant-numeric: tabular-nums; }
.state .sum b { font: 700 15px var(--display); }
.tabs, .bar, .seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tabs button, .seg button, .chip { font: 700 12px var(--display); letter-spacing: .1em; min-height: 44px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted); cursor: pointer; }
.tabs button[aria-current="page"], .seg button[aria-pressed="true"], .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); background: var(--sunk); }
.seg button[aria-pressed="true"]::before, .chip[aria-pressed="true"]::before { content: '\2713\00a0'; }
.tabs button:hover, .seg button:hover, .chip:hover, .btn:hover { border-color: var(--accent); }
.tabs button:active, .seg button:active, .chip:active, .btn:active { transform: translateY(1px); }
button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar label { font: 600 12px var(--body); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.bar select, .bar input[type="search"], .bar input[type="number"] { font: 400 16px var(--body); min-height: 44px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); max-width: 100%; box-sizing: border-box; }
.bar input[type="search"] { width: min(240px, 100%); }
.bar input[type="number"] { width: 72px; }
.frow { display: flex; gap: 6px; align-items: center; flex: 1 1 100%; min-width: 0; }
.frow label { flex: none; }
.frow select { max-width: 150px; flex: 0 1 auto; min-width: 0; }
.frow input[type="search"] { flex: 1 1 120px; width: auto; min-width: 0; }
::placeholder { color: var(--muted); opacity: .85; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
details.more { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 10px 8px; box-sizing: border-box; }
details.more summary { cursor: pointer; font: 600 12px var(--display); letter-spacing: .1em; color: var(--muted); min-height: 44px; display: flex; align-items: center; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: '+\00a0'; font-weight: 700; }
details.more[open] summary::before { content: '\2212\00a0'; }
.list { display: flex; flex-direction: column; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.slot { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.slot.has { flex-direction: row; flex-wrap: wrap; gap: 8px 12px; align-items: flex-start; }
.slot.has > .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 150px; }
.slot.has > .ed { flex: 1 1 100%; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; }
.ln { font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.nt { display: block; color: var(--muted); }
.warnnote { color: var(--gold); }
.pill { display: inline-block; font: 600 11px var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.ok { color: var(--good); } .mine { color: var(--gold); } .none { color: var(--warn); } .stand { color: var(--accent); } .text { color: var(--muted); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: 600 13px var(--body); min-height: 44px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--sunk); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--warn); background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.ed { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.ed label, .ed legend { font: 600 12px var(--body); color: var(--muted); }
.ed input:not([type="checkbox"]):not([type="file"]), .ed select, .ed textarea { font: 400 16px var(--body); width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); box-sizing: border-box; }
.ed input[type="file"] { font: 400 14px var(--body); max-width: 100%; color: var(--ink); }
.ed input[type="file"]::file-selector-button { min-height: 44px; padding: 0 16px; margin-right: 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--sunk); color: var(--ink); font: 600 13px var(--body); cursor: pointer; }
.ck { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font: 400 14px var(--body); color: var(--ink); }
.ck input { width: 22px; height: 22px; accent-color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.two > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.err { color: var(--warn); font-size: 13px; font-weight: 600; }
.err:empty { display: none; }
.stage { position: relative; background: var(--stage); border-radius: 10px; overflow: hidden; flex: none; }
.stage video { display: block; width: 100%; height: 100%; object-fit: cover; }
.stage.md { width: 120px; height: 120px; }
.stage .pp { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: pointer; }
.stage .ind { display: none; position: absolute; right: 6px; bottom: 6px; width: 28px; height: 28px; border-radius: 14px; background: rgba(10, 0, 20, .75); color: #fff; font-size: 12px; align-items: center; justify-content: center; }
.stage .ind::before { content: '\25B6'; }
.stage.paused .ind { display: flex; }
.stage .pp:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
video.pv { width: 100%; max-width: 320px; max-height: 240px; object-fit: contain; border-radius: 8px; background: #000; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.copybox { width: 100%; min-height: 140px; font: 400 13px/1.4 var(--body); border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); box-sizing: border-box; padding: 8px 10px; }
/* Raw footage and review */
.state.gen { width: 100%; box-sizing: border-box; gap: 8px; padding: 10px 12px; }
.state.gen .btn { background: var(--surface); }
.state.gen .btn.primary { background: var(--accent); }
#gen-msg:empty { display: none; }
.vgrp { display: flex; flex-direction: column; gap: 8px; min-width: 0; --ch: 512px; }
/* A video's cards are only laid out near the screen. The size kept for the rest is a guess from the number of cards (--n, --j), then the real size once seen. Only where the browser holds the scroll position steady when such a guess is corrected (scroll anchoring); elsewhere every card is laid out, and the fixed boxes below keep the page from moving. */
@supports (overflow-anchor: auto) { .vgrp { content-visibility: auto; contain-intrinsic-size: auto 300px auto calc(30px + var(--n, 2) * var(--ch) + var(--j, 0) * 54px); } }
h3.vid { font: 600 13px var(--body); margin: 2px 0 0; overflow-wrap: anywhere; }
h3.vid span { font-weight: 400; color: var(--muted); }
.sgc { gap: 8px; }
.sgc.skipped { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.sgc.skipped .ln { flex: 1 1 140px; }
.sgc.skipped .err { flex: 1 1 100%; }
/* The strip's box has one shape whatever the footage, so the page does not move when a picture arrives. The picture is fitted inside it once its own shape (--r, one frame) is known. */
.strip { aspect-ratio: 10; border-radius: 8px; overflow: hidden; background: var(--sunk); }
.strip.known { background: none; }
.strip .fr { width: 100%; border-radius: 8px; overflow: hidden; }
.strip:not(.known) img { visibility: hidden; }
.strip span { display: block; overflow: hidden; }
.strip img { display: block; width: 100%; max-width: none; height: auto; }
.strip .b { display: none; }
.sgrow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-start; }
.sgrow > .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 150px; }
.tm { font-weight: 600; font-variant-numeric: tabular-nums; }
/* The preview box is one shape too. Its still picture (one frame of the strip) and its video sit inside it at the footage's own shape. */
.stage.pvw { height: clamp(150px, 22vw, 240px); aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; }
.stage.pvw .fr, .stage.pvw video { grid-area: 1 / 1; }
@media (max-width: 560px) { .sgrow > .stage.pvw { aspect-ratio: 1; } }
.stage.pvw .fr { display: none; background: no-repeat 42.86% 50% / 800% 100%; }
.stage.sq { width: 240px; max-width: 100%; aspect-ratio: 1; }
.stage.pvw video, .stage.sq video { object-fit: contain; }
.pair { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; container-type: inline-size; }
.pair figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 100%; }
.pair figcaption { font: 600 12px var(--body); color: var(--muted); }
.pair .stage.pvw { height: 240px; aspect-ratio: var(--r, 0.5625); }
.sgc form > input, .sgc form > details { max-width: 560px; }
.more .in { display: flex; flex-direction: column; gap: 6px; }
.ed details.more { border: 0; padding: 0; background: transparent; }
details.junk { background: transparent; }
details.junk:not([open]) { padding-bottom: 0; }
details.junk > summary { font: 600 13px var(--body); letter-spacing: 0; }
details.junk > .in { gap: 8px; }
/* A closed section inside an open one keeps its plus sign. */
details.more:not([open]) > summary::before { content: '+\00a0'; }
.ed .small:empty { display: none; }
.ck.off { color: var(--muted); }
@media (max-width: 560px) { .vgrp { --ch: 570px; } .strip { aspect-ratio: 32 / 9; } .strip.wide img { width: 200%; } .strip.wide .b { display: block; } .strip.wide .b img { margin-left: -100%; } .pair .stage.pvw { height: clamp(160px, 46vw, 240px); } .pair .stage.sq { width: clamp(160px, 46vw, 240px); } }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr; } .stage.md { width: 96px; height: 96px; } .tabs button { letter-spacing: .04em; padding: 8px; } .seg button { letter-spacing: .06em; padding: 8px 9px; } }
@media (max-width: 379px) { .tabs button { font-size: 11px; padding: 8px 7px; } .seg button { padding: 8px; } }
/* The source and its loop size to the card they sit in, so an upright source fits beside the loop and a wide one stacks above it. */
@supports (width: 1cqw) {
  .pair .stage.pvw { height: clamp(150px, 58cqw, 240px); } .pair .stage.sq { width: clamp(150px, 58cqw, 240px); }
  .strip, .stage.pvw { container-type: size; }
  .strip.known .fr { width: min(100cqw, calc(100cqh * 8 * var(--r))); }
  .stage.pvw.known .fr { display: block; width: min(100cqw, calc(100cqh * var(--r))); aspect-ratio: var(--r); }
  @media (max-width: 560px) { .strip.wide.known .fr { width: min(100cqw, calc(100cqh * 2 * var(--r))); } }
}
/* The cut editor: the whole video, a bar for its length with the stretch marked on it and a handle at each end, and the buttons to move them. One card at a time holds it. */
.cx { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
.stage.cxv { width: 100%; max-width: 560px; aspect-ratio: 16 / 9; max-height: 60vh; }
.stage.cxv video { object-fit: contain; }
.cxbar { position: relative; height: 44px; max-width: 560px; touch-action: pan-y; cursor: pointer; --a: 0%; --b: 100%; --t: 0%; user-select: none; -webkit-user-select: none; }
.cxtrack { position: absolute; left: 0; right: 0; top: 13px; height: 18px; border-radius: 4px; background: var(--sunk); border: 1px solid var(--line-strong); overflow: hidden; }
.cxo { position: absolute; top: 0; bottom: 0; background: var(--line-strong); opacity: .35; }
.cxo.j { opacity: .15; }
.cxsel { position: absolute; top: 0; bottom: 0; left: var(--a); width: calc(var(--b) - var(--a)); background: var(--accent); opacity: .5; }
.cxph { position: absolute; top: 0; bottom: 0; left: var(--t); width: 2px; margin-left: -1px; background: var(--ink); }
.cxh { position: absolute; top: 4px; width: 14px; height: 36px; margin-left: -7px; border-radius: 4px; background: var(--accent); border: 2px solid var(--surface); box-sizing: border-box; cursor: ew-resize; }
.cxh::after { content: ''; position: absolute; inset: -4px -10px; }
.cxh[data-cxh="from"] { left: var(--a); } .cxh[data-cxh="to"] { left: var(--b); }
.cxh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cxh[aria-disabled="true"] { opacity: .45; cursor: default; }
.cxt { font-variant-numeric: tabular-nums; }
.cx .chip { min-width: 60px; }
.btn.due { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
</style>

<div class="wrap">
  <header>
    <h1>Exercise Loop Board</h1>
    <p class="muted">Your violet loops, the exercises that still need a video, raw footage to turn into loops, new exercises to approve and squats to name. Nothing goes into the app until you say push.</p>
    <div class="state" id="state" role="status">Opening the board…</div>
  </header>
  <main>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="bar" id="bar"></div>
    <div id="out" class="list"><p class="muted">Loading the exercises…</p></div>
  </main>
  <div class="sr" id="live" role="status" aria-live="polite"></div>
  <datalist id="ex-names"></datalist>
</div>

<script>
(function () {
  'use strict';
  var MAX = 20 * 1024 * 1024, LINKMAX = 2000;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
  var kebab = function (s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); };
  var exKey = function (id) { return 'ex.' + kebab(id); };
  var repKey = function (slug) { return 'rep.' + slug; };
  var lpKey = function (slug) { return 'loop.' + slug; };
  var isAsset = function (id) { return /^[A-Za-z0-9]{32}$/.test(id || ''); };
  var reduced = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

  var D = null, byId = {}, E = new Map(), db = null, assets = null, known = false, dead = false, synced = false, slow = false;
  var TABS = [['submit', 'TO SUBMIT'], ['raw', 'RAW FOOTAGE'], ['review', 'REVIEW'], ['loops', 'LOOPS MADE'], ['new', 'NEW EXERCISES'], ['squats', 'SQUATS']];
  var tab = 'submit', sort = 'group', group = 'all', show = 'todo', q = '', kinds = { library: true, quick: true, program: true, mission: false };
  var edit = null, copyText = '', justSaved = new Set(), moreOpen = false, drafts = {}, sqBusy = new Set(), qTimer = null;
  // Raw footage: S holds Claude's "segs" documents by id. Ids are made safe (letters, digits, "-") before they go into element ids: sidOf and idOf map both ways.
  var bare = function () { return Object.create(null); };
  var EST = 6, CAPKEY = 'loopboard.cap', S = new Map(), sidOf = bare(), idOf = bare(), segSynced = false, NAMES = new Map(), LOOPED = new Set(), T = null;
  var rshow = 'all', rfolder = 'all', sgDraft = bare(), rvDraft = bare(), rvOpen = bare(), sgErr = bare(), cutOpen = bare(), junkOpen = bare(), ar = bare(), asked = bare(), sgBusy = new Set(), keep = new Set();
  // rvKeep: where an answered review card stays until the tab is left. sgSent and sgAgain: what a save in flight carried, and whether newer text waits behind it. qOf: the search text of each tab.
  var rvKeep = bare(), sgSent = bare(), sgAgain = bare(), qOf = bare(), quiet = bare(), readOnly = false, accSeen = false, bulkAt = 0, bulkN = 0;
  var cap = 150, capText = null, genBusy = '', genErr = '', stale = false, down = false, staleT = null;
  // Cutting: C holds the "clips" documents (one per video: its whole-video proxy, written by Claude's scan), S0 Claude's own stretches. S is S0 plus the stretches the owner added ("add." documents in items) that Claude has not taken on yet.
  // cutEd is the one stretch whose card holds the cut editor; cxLoop the range a "Play the cut" repeats; cxDrag a handle or the play mark being dragged.
  var C = new Map(), S0 = new Map(), clipSynced = false, cutEd = null, cxLoop = bare(), cxDrag = null, cxBusy = '', cxHold = null;
  // keepNew: stretches the owner added in this visit, shown whatever the search or folder filter. cxStart: where the editor's video starts when it is put on a card. cxArm: a Remove waiting for its second tap. cxQuiet: a short time after a removal in which taps are not taken (a double tap must not reach the card that slid up). issued: ids given out in this visit, never given out twice.
  // DUP: stretches hidden as duplicates (id -> { of, why }), worked out in tally(); dupOn: whether they are hidden now.
  var DUP = bare(), dupOn = true, DUPMIN = 0.6;
  var keepNew = new Set(), cxStart = null, cxArm = bare(), cxQuiet = 0, issued = new Set();
  // NEWDAYS: how long a stretch Claude has just added counts as new. topKeep: the stretches that were in the NEW AND TO CUT group when the owner answered them; they stay there until the tab is left, so a card never slides away under a finger.
  var NEWDAYS = 21, topKeep = new Set();
  var BUSYMSG = 'The queue is still being changed. Try again in a moment.';
  try { var cap0 = parseInt(localStorage.getItem(CAPKEY), 10); if (cap0 >= 10 && cap0 <= 1000) cap = cap0; } catch (x) {}
  var KIND_LABEL = { library: 'Library', quick: 'Quick Mission only', mission: 'Mission move', program: 'Shown in programs, not in the library', 'new': 'New' };

  // ---- data helpers ----
  var doc = function (k) { return E.get(k) || null; };
  var hasVideo = function (d) { return !!d && ((d.source === 'upload' && isAsset(d.asset)) || (d.source === 'link' && /^https?:\/\//.test(d.video || ''))); };
  var submitted = function (e) { return hasVideo(doc(exKey(e.id))); };
  var loopDoc = function (slug) { return doc(lpKey(slug)) || {}; };
  var loopName = function (slug) { var d = loopDoc(slug); return (d.name && String(d.name).trim()) || (D.loops[slug] && D.loops[slug].name) || slug; };
  var needs = function (e) { return e.kind !== 'new' && e.match !== 'direct' && !e.nonExercise && !e.dupOf; };
  var kindOk = function (e) { return kinds[e.kind] !== false; };
  var wanted = function (e) { return needs(e) && kindOk(e); };
  var matchQ = function (name, extra) { return !q || (String(name) + ' ' + (extra || '')).toLowerCase().indexOf(q.toLowerCase()) >= 0; };
  var sentence = function (s) { s = String(s || '').trim(); return s && !/[.!?]$/.test(s) ? s + '.' : s; };
  var canEdit = function () { return !!db && !dead && synced && !readOnly; };
  var say = function (m) { var l = $('live'); if (!l) return; l.textContent = ''; setTimeout(function () { l.textContent = m; }, 40); };

  function usedHint(e) {
    var w = e.where;
    if (!w) return e.kind === 'mission' ? 'Used in Loadout missions' : '';
    var bits = [], p = Math.round(w.programs || 0);
    if (p >= 1) bits.push(p + ' program day' + (p === 1 ? '' : 's')); else if (w.programs > 0) bits.push('a light program use');
    if (w.quick) bits.push('Quick Mission pool');
    if (w.builder) bits.push('Builder');

  }

  // ---- video bits ----
  function stage(slug, cls) {
