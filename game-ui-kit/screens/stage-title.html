<!-- @dsCard group="Screens" -->
<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap');
*{margin:0;box-sizing:border-box}
body{background:#080012;font-family:'Rajdhani',sans-serif;color:#eee}
.card{position:relative;width:920px;height:360px;margin:16px auto;border:1px solid rgba(168,85,247,.3);border-radius:14px;overflow:hidden;background:radial-gradient(circle at 70% 30%,#241046 0%,#080012 65%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.22) 3px 4px);pointer-events:none}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 60px}
.ep{font-family:'Orbitron';font-weight:700;font-size:13px;letter-spacing:6px;color:#c99cff;margin-bottom:10px}
.title{font-family:'Orbitron';font-weight:900;font-size:44px;letter-spacing:2px;color:#fde047;text-shadow:0 0 24px rgba(253,224,71,.4),4px 4px 0 rgba(124,58,237,.7)}
.sub{font-size:17px;font-weight:600;color:#d9c9f5;margin-top:10px;letter-spacing:1px}
.rule{width:120px;height:3px;background:linear-gradient(90deg,#fde047,#a855f7);margin-top:18px;border-radius:2px}
.corner{position:absolute;right:34px;bottom:24px;text-align:right;font-family:'Orbitron';font-size:10px;letter-spacing:2px;color:#8f80ab;line-height:1.9}
.corner b{color:#ff8181}
</style></head><body>
<div class="card">
  <div class="inner">
    <div class="ep">EPISODE 03 · FIGHT SIDE</div>
    <div class="title">THE OLD SCHOOL GYM</div>
    <div class="sub">"He's not a knockoff. He's a LEGEND. Just ask him." — COACH briefing (probably a lie)</div>
    <div class="rule"></div>
  </div>
  <div class="corner">BOSS <b>MIKE BISON</b><br>OBJECTIVE · TAKE THE BELT<br>WORKOUT PHASE · HEAVY BAG MASH</div>
  <div class="scan"></div>
</div>
</body></html>
